[data-theme="light"] {

* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif; padding:14px 12px; transition:background .3s,color .3s; }
.container { max-width:960px; margin:0 auto; }

/* Header */
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.header h1 { font-size:15px; font-weight:700; }
.header .meta { font-size:11px; color:var(--muted); }
.btn { padding:6px 14px; background:var(--card2); color:var(--muted); border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:12px; }
.btn:hover { color:var(--text); }
.pos { color:var(--green); } .neg { color:var(--red); }

/* Stats Bar */
.stats-bar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; padding:14px 16px; background:var(--card); border:1px solid var(--border); border-radius:10px; }
.stat-item { flex:1; min-width:80px; }
.stat-label { font-size:10px; color:var(--muted); margin-bottom:2px; }
.stat-value { font-size:20px; font-weight:800; line-height:1.2; }
.stat-sub { font-size:11px; color:var(--muted); margin-top:2px; }

/* Cards */
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.card-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.card-title { font-size:12px; font-weight:600; color:var(--text); }
.card-status { font-size:11px; font-weight:600; }
.card-sub { font-size:10px; color:var(--muted); margin-bottom:8px; }
.card-value { font-size:26px; font-weight:800; line-height:1.1; }
.card-max { font-size:13px; color:var(--muted); font-weight:400; }
.card-bar { height:4px; background:var(--card2); border-radius:99px; margin:8px 0; overflow:hidden; }
.card-bar-fill { height:100%; border-radius:99px; }
.card-detail { font-size:12px; color:var(--muted); line-height:1.6; }
.card-dist { font-size:11px; color:var(--muted); margin-top:4px; font-style:italic; }

/* DCA Badge */
.dca-circle { display:inline-flex; align-items:center; justify-content:center; width:68px; height:68px; border-radius:50%; font-size:32px; font-weight:800; flex-shrink:0; }

/* Dim bars */
.dim-row { display:flex; gap:6px; margin-top:10px; }
.dim-item { flex:1; text-align:center; font-size:10px; color:var(--muted); }
.dim-item .bar { height:4px; background:var(--card2); border-radius:2px; margin:2px 0; overflow:hidden; }
.dim-item .bar .fill { height:100%; border-radius:2px; }

/* Two-col grid for signal cards */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }

/* Chart */
.chart-box { margin-bottom:14px; }
.chart-tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; }
.chart-tab { padding:4px 10px; background:var(--card2); color:var(--muted); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:11px; }
.chart-tab.active { background:var(--green); color:#fff; border-color:var(--green); }

/* MA row */
.ma-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:13px; }
.ma-row .label { color:var(--muted); }

/* Footer */
.footer { text-align:center; color:var(--muted); font-size:10px; padding:20px 0 0; line-height:1.8; }
.footer a { color:#fbbf24; }

@media(min-width:600px) {
  body { padding:20px 24px; }
  .stat-value { font-size:24px; }
  .card-value { font-size:30px; }
}

  });
  // MA card
  h+='<div class="card"><div class="card-title">MA · 均线参考</div><div class="card-sub">中长期均线位置</div>';
  [['MA50',D.ma50],['MA120',D.ma120],['MA200',D.ma200]].forEach(function(r){var p=(D.price/r[1]-1)*100;h+='<div class="ma-row"><span class="label">'+r[0]+'</span><b>'+fmt$$(r[1])+'</b><span class="'+(p>=0?'pos':'neg')+'">'+fmtP(p)+'</span></div>';});
  h+='<div class="card-dist" style="margin-top:6px;">'+(D.price<D.ma200?'价格跌破均线(偏弱·底部特征)':'价格在均线上方')+'</div></div>';
  h+='</div>';

  // Chart
  h+='<div class="card chart-box"><div class="card-title">📈 BTC价格 + 综合评分</div><div class="card-sub">每15分钟更新 · 绿线=综合评分(右轴)</div><div class="chart-tabs">';
  [{d:90,l:'3月'},{d:180,l:'6月'},{d:365,l:'1年'},{d:730,l:'2年'},{d:0,l:'全部'}].forEach(function(r){
    h+='<button class="chart-tab'+(r.d===chartRange?' active':'')+'" onclick="setRange('+r.d+')">'+r.l+'</button>';
  });
  h+='</div><div id="mainChart" style="height:380px;"></div></div>';

  document.getElementById('app').innerHTML = h;
  (function() { var t = localStorage.getItem('btc-theme') || 'dark'; document.getElementById('themeBtn').textContent = t==='dark'?'☀️':'🌙'; })();
  drawChart();
}

function setRange(d) { chartRange=d; document.querySelectorAll('.chart-tab').forEach(function(b){b.classList.remove('active');}); event.target.classList.add('active'); drawChart(); }

function drawChart() {
  var dates=D.chartDates, prices=D.chartPrices, scores=D.chartScores;
  if (chartRange>0 && chartRange<dates.length) { dates=dates.slice(-chartRange); prices=prices.slice(-chartRange); scores=scores.slice(-chartRange); }
  var isDark = document.documentElement.getAttribute('data-theme')==='dark';
  Plotly.newPlot('mainChart', [
    {x:dates,y:prices,type:'scatter',mode:'lines',name:'BTC',yaxis:'y',line:{color:'#fbbf24',width:1.5},hovertemplate:'%{x}<br>$%{y:,.0f}<extra></extra>'},
    {x:dates,y:scores,type:'scatter',mode:'lines',name:'评分',yaxis:'y2',line:{color:'#10b981',width:1},hovertemplate:'%{x}<br>%{y:.0f}/100<extra></extra>'}
  ], {
    paper_bgcolor:isDark?'#161618':'#fff', plot_bgcolor:isDark?'#0a0a0b':'#f8fafc',
    font:{color:isDark?'#e4e4e7':'#1e293b'}, hovermode:'x unified',
    xaxis:{gridcolor:isDark?'#27272a':'#e2e8f0',tickfont:{size:10}},
    yaxis:{type:'log',gridcolor:isDark?'#27272a':'#e2e8f0',tickfont:{size:10},title:{text:'价格(log)',font:{size:10}}},
    yaxis2:{overlaying:'y',side:'right',range:[0,100],tickfont:{size:10},title:{text:'评分',font:{size:10}},showgrid:false},
    margin:{l:50,r:45,t:5,b:35}, legend:{x:0.01,y:0.99,bgcolor:'rgba(0,0,0,0)'}
  }, {responsive:true});
}
</script>
</body>
</html>
