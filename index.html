<style>

[data-theme="light"] {
  --bg:#f8fafc; --card:#fff; --card2:#f1f5f9; --border:#e2e8f0;
  --text:#1e293b; --muted:#64748b;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif; padding:24px; transition:background .3s,color .3s; }
.wrap { max-width:1280px; margin:0 auto; }
.pagetitle { font-size:13px; color:var(--muted); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.pagetitle b { color:var(--text); font-size:15px; }
.pagetitle a { color:#fbbf24; text-decoration:none; }
.pos { color:var(--green); } .neg { color:var(--red); }

/* HERO */
.hero { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
.hero-price { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px; display:flex; flex-direction:column; justify-content:center; }
.hero-price .label { font-size:13px; color:var(--muted); margin-bottom:6px; }
.hero-price .big { font-size:48px; font-weight:800; line-height:1; }
.hero-price .chg { font-size:20px; margin-top:6px; }
.hero-price .meta { display:flex; gap:24px; margin-top:18px; font-size:13px; color:var(--muted); flex-wrap:wrap; }
.hero-price .meta b { color:var(--text); }
.hero-gauge { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.gauge-zone { margin-top:8px; padding:6px 18px; border-radius:999px; font-size:15px; font-weight:600; }
.gauge-dca { margin-top:10px; font-size:13px; color:var(--muted); }
.gauge-dca b { font-size:18px; }

/* CARDS */
.section-title { font-size:14px; font-weight:600; color:var(--text); margin:8px 0 14px; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; transition:background .3s; }
.card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.card-title { font-size:14px; color:var(--text); font-weight:600; }
.card-status { font-size:12px; font-weight:600; }
.card-sub { font-size:11px; color:var(--muted); margin-bottom:10px; }
.card-now { font-size:13px; color:var(--muted); margin-bottom:4px; }
.card-now b { font-size:21px; color:var(--text); font-weight:800; }
.card-score { font-size:34px; font-weight:700; line-height:1; }
.card-score-max { font-size:15px; color:var(--muted); font-weight:400; }
.card-bar { height:5px; background:var(--card2); border-radius:99px; margin:10px 0; overflow:hidden; }
.card-bar-fill { height:100%; border-radius:99px; transition:width .3s; }
.card-raw { font-size:13px; color:var(--muted); margin-top:2px; }
.card-raw b { color:var(--text); }
.card-dist { font-size:12px; color:var(--muted); margin-top:4px; font-style:italic; }
.ma-rows { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
.ma-row { display:flex; justify-content:space-between; align-items:center; font-size:14px; }
.ma-row span:first-child { color:var(--muted); }
.ma-row b { color:var(--text); }

/* DCA Card */
.dca-badge { display:inline-flex; align-items:center; justify-content:center; width:72px; height:72px; border-radius:50%; font-size:36px; font-weight:800; flex-shrink:0; }
.dca-row { display:flex; align-items:center; gap:20px; margin:8px 0; }
.dim-bar { flex:1; text-align:center; font-size:11px; color:var(--muted); }
.dim-bar .bar { height:4px; background:var(--card2); border-radius:2px; margin:3px 0; overflow:hidden; }
.dim-bar .bar .fill { height:100%; border-radius:2px; transition:width .3s; }

.chart-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:24px; }
.chart-box h3 { font-size:14px; margin-bottom:4px; color:var(--text); }
.chart-box .sub { font-size:12px; color:var(--muted); margin-bottom:10px; }
.chart-range { padding:5px 12px; background:var(--card2); color:var(--muted); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:12px; margin-right:4px; }
.chart-range.active { background:var(--green); color:#fff; border-color:var(--green); }
.chart-toggles { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px; }

/* Theme & buttons */
.btn { padding:6px 14px; background:var(--card2); color:var(--muted); border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:12px; transition:all .2s; }
.btn:hover { color:var(--text); border-color:var(--muted); }

.sys-note { margin-top:18px; padding:16px 18px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:10px; font-size:13px; line-height:1.85; color:var(--muted); }
.sys-note h4 { margin:0 0 8px; font-size:14px; color:var(--text); }
.sys-note p { margin:6px 0; }
.sys-note ul { margin:6px 0 0; padding-left:20px; }
.sys-note li { margin:4px 0; }
.sys-note b { color:var(--text); font-weight:600; }
.disclaimer { margin-top:36px; padding-top:20px; border-top:1px solid var(--border); text-align:center; color:var(--muted); font-size:12px; line-height:1.9; }
.disclaimer a { color:#fbbf24; text-decoration:none; }
.updated { font-size:11px; color:var(--muted); margin-top:4px; }

@media(max-width:900px){ .hero{grid-template-columns:1fr;} .grid3{grid-template-columns:repeat(2,1fr);} }
@media(max-width:600px){ body{padding:14px;} .hero-price .big{font-size:36px;} .grid3{grid-template-columns:1fr;} .dca-row{flex-direction:column;align-items:flex-start;} }

function render() {
  var zone=zoneFor(D.totalScore), dcaMsg=D.totalScore>=80?'强烈买入信号！可分批建仓':D.totalScore>=70?'低估区域，适合定投加仓':D.totalScore>=55?'偏低估，可小额定投':D.totalScore>=40?'暂不便宜，继续观察':'价格偏高，注意风险';
  var dca=D.dcaMult||0, dcaLabel=D.dcaLabel||'—', dcaC=document.documentElement.getAttribute('data-theme')==='dark'?dcaBadgeColor(dca):dcaBadgeColor(dca);
  var cards=[{t:'S1 · 均线位置',s:D.maScore,m:20,su:'价格相对中长期均线的位置',st:statusFor(D.maScore*5),nw:'BTC <b>'+fmtUSD2(D.price)+'</b> · MA50: '+fmtUSD2(D.ma50)+' · MA200: '+fmtUSD2(D.ma200),rw:'MA50: '+fmtUSD2(D.ma50)+' · MA120: '+fmtUSD2(D.ma120)+' · MA200: '+fmtUSD2(D.ma200),dt:D.price<D.ma200?'价格低于MA200（长期低估信号）':D.price<D.ma120?'低于MA120':'均线上方',c:scoreColor(D.maScore*5)},{t:'S2 · RSI 偏差',s:D.rsiScore,m:20,su:'14日相对强弱指标',st:statusFor(D.rsiScore*5),nw:'RSI(14) <b>'+D.rsi.toFixed(1)+'</b> · '+(D.rsi<30?'超卖区':D.rsi<50?'偏弱':'中性'),rw:'RSI越低越接近底部 · 超卖(<30)为最强买入信号',dt:D.rsi<30?'已进入超卖区（强买入信号）':D.rsi<40?'接近超卖':'中性区间',c:scoreColor(D.rsiScore*5)},{t:'S3 · ATH回撤',s:D.ddScore,m:20,su:'从历史最高点回撤的幅度',st:statusFor(D.ddScore*5),nw:'回撤 <b>'+D.drawdownPct.toFixed(1)+'%</b> · ATH: $124,715',rw:'回撤越大越接近底部 · 历史极端回撤70-85%',dt:D.drawdownPct>60?'深度回撤（历史大底特征）':D.drawdownPct>40?'显著回撤':'回撤不足',c:scoreColor(D.ddScore*5)},{t:'S4 · 恐慌贪婪',s:D.fngScore,m:20,su:'市场情绪指标',st:statusFor(D.fngScore*5),nw:'恐慌指数 <b>'+D.fngVal+'</b> · 「'+D.fngClass+'」',rw:'0=极度恐慌(底部) / 100=极度贪婪(顶部)',dt:D.fngVal<=15?'已进入恐慌抄底区':D.fngVal<=30?'偏恐慌':'情绪中性',c:'#fbbf24'},{t:'S5 · 区间位置',s:D.posScore,m:20,su:'价格在近90天高低点间的位置',st:statusFor(D.posScore*5),nw:'当前 <b>'+D.posInRange.toFixed(1)+'%</b> · 90日: '+fmtUSD2(D.lo90)+' - '+fmtUSD2(D.hi90),rw:'越接近90日低点越有支撑 · 越低越好',dt:D.posInRange<20?'接近90日低点（强支撑）':D.posInRange<40?'偏低位置':'中高位',c:scoreColor(D.posScore*5)}];

  var h='<div class="hero"><div class="hero-price"><div class="label">BTC 价格 (USD)</div><div class="big">'+fmtUSD(D.price)+'</div><div class="chg"><span class="'+(D.chgPct>=0?'pos':'neg')+'">'+fmtPct(D.chgPct)+'</span> <span style="color:var(--muted);font-size:13px;">24h</span></div><div class="meta"><span>24h高: <b>'+fmtUSD(D.high24)+'</b></span><span>24h低: <b>'+fmtUSD(D.low24)+'</b></span><span>量: <b>$'+(D.vol24/1e9).toFixed(1)+'B</b></span></div><div class="updated">更新: '+D.updated+'</div></div>';
  h+='<div class="hero-gauge"><div style="font-size:13px;color:var(--muted);align-self:flex-start;">综合评分</div>'+drawGauge(D.totalScore)+'<div class="gauge-zone" style="color:'+zone[1]+';">'+zone[0]+'</div><div class="gauge-dca"><b style="color:'+zone[1]+';">'+dcaMsg+'</b></div></div></div>';

  // DCA card (circular badge + sub-bars)
  var dc=dcaBadgeColor(dca);
  h+='<div class="card" style="margin-bottom:24px;"><div class="card-head"><span class="card-title" style="font-size:16px;">🎯 定投建议</span><span class="card-status" style="color:'+dc+';font-size:14px;">'+dcaLabel+'</span></div>';
  h+='<div class="dca-row"><div class="dca-badge" style="background:'+dc+'22;color:'+dc+';border:2px solid '+dc+';">'+dca+'<span style="font-size:16px;">x</span></div>';
  h+='<div style="font-size:14px;color:var(--muted);">每期定投金额 × <b style="color:var(--text);">'+dca+'</b><br>活跃维度: '+(D.sActive||0)+'/'+(D.sMax||15)+' · 原始分: '+(D.sRaw||0)+'</div></div>';
  h+='<div style="display:flex;gap:8px;margin-top:12px;">';
  [{n:'MA',v:D.dMa||0},{n:'RSI',v:D.dRsi||0},{n:'恐慌',v:D.dFng||0},{n:'回撤',v:D.dDd||0},{n:'区间',v:D.dPos||0}].forEach(function(d){
    h+='<div class="dim-bar">'+d.n+'<div class="bar"><div class="fill" style="width:'+(d.v/3*100)+'%;background:'+dimColor(d.v)+';"></div></div>'+d.v+'/3</div>';
  });
  h+='</div></div>';

  // Signal cards
  h+='<div class="section-title">5 个信号 + 均线参考</div><div class="grid3">';
  cards.forEach(function(c){
    h+='<div class="card"><div class="card-head"><span class="card-title">'+c.t+'</span><span class="card-status" style="color:'+c.st[1]+'">'+c.st[0]+'</span></div><div class="card-sub">'+c.su+'</div><div class="card-score" style="color:'+c.c+';">'+c.s+'<span class="card-score-max">/'+c.m+'</span></div><div class="card-bar"><div class="card-bar-fill" style="width:'+(c.s/c.m*100)+'%;background:'+c.c+';"></div></div><div class="card-now">'+c.nw+'</div><div class="card-raw">'+c.rw+'</div><div class="card-dist">'+c.dt+'</div></div>';
  });
  h+='<div class="card"><div class="card-head"><span class="card-title">MA · 均线参考</span><span class="card-status" style="color:#71717a;">纯参考</span></div><div class="card-sub">中长期均线</div><div class="ma-rows">';
  [['MA50',D.ma50],['MA120',D.ma120],['MA200',D.ma200]].forEach(function(r){var p=(D.price/r[1]-1)*100;h+='<div class="ma-row"><span>'+r[0]+'</span><b>'+fmtUSD2(r[1])+'</b><span class="'+(p>=0?'pos':'neg')+'">'+fmtPct(p)+'</span></div>';});
  h+='<div class="card-raw" style="margin-top:8px;">'+(D.price<D.ma200?'价格跌破均线(偏弱·底部特征)':'价格在均线上方')+'</div></div></div>';

  // Chart
  h+='<div class="chart-box"><h3>📈 BTC价格 + 综合评分</h3><div class="sub">绿线=综合评分(右轴) · 数据每15分钟更新</div><div class="chart-toggles">';
  [{d:90,l:'3个月'},{d:180,l:'6个月'},{d:365,l:'1年'},{d:730,l:'2年'},{d:0,l:'全部'}].forEach(function(r){
    h+='<button class="chart-range'+(r.d===chartRange?' active':'')+'" onclick="setRange('+r.d+')">'+r.l+'</button>';
  });
  h+='</div><div id="mainChart" style="height:420px;"></div></div>';
  document.getElementById('app').innerHTML = h;
  drawChart();
}

function setRange(d) {
  chartRange = d;
  document.querySelectorAll('.chart-range').forEach(function(b){b.classList.remove('active');});
  event.target.classList.add('active');
  drawChart();
}

function drawChart() {
  var dates=D.chartDates, prices=D.chartPrices, scores=D.chartScores;
  if (chartRange>0 && chartRange<dates.length) {
    dates=dates.slice(-chartRange); prices=prices.slice(-chartRange); scores=scores.slice(-chartRange);
  }
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var paper = isDark ? '#161618' : '#ffffff';
  var plotBg = isDark ? '#0a0a0b' : '#f8fafc';
  var fontC = isDark ? '#e4e4e7' : '#1e293b';
  var gridC = isDark ? '#27272a' : '#e2e8f0';
  Plotly.newPlot('mainChart', [
    {x:dates,y:prices,type:'scatter',mode:'lines',name:'BTC价格',yaxis:'y',line:{color:'#fbbf24',width:1.5},hovertemplate:'%{x}<br>$%{y:,.0f}<extra></extra>'},
    {x:dates,y:scores,type:'scatter',mode:'lines',name:'综合评分',yaxis:'y2',line:{color:'#10b981',width:1},hovertemplate:'%{x}<br>%{y:.0f}/100<extra></extra>'}
  ], {
    paper_bgcolor:paper, plot_bgcolor:plotBg,
    font:{color:fontC}, hovermode:'x unified',
    xaxis:{gridcolor:gridC, tickfont:{size:10}},
    yaxis:{type:'log', gridcolor:gridC, tickfont:{size:10}, title:{text:'价格(log)',font:{size:11}}},
    yaxis2:{overlaying:'y', side:'right', range:[0,100], tickfont:{size:10}, title:{text:'综合评分',font:{size:11}}, showgrid:false},
    margin:{l:60,r:55,t:10,b:40},
    legend:{x:0.01,y:0.99,bgcolor:'rgba(0,0,0,0)'}
  }, {responsive:true});
}
</script>
</body>
</html>
