<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC 底部信号看板</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root { --bg:#0a0a0b; --card:#161618; --card2:#1f1f23; --border:#2a2a2e; --text:#e4e4e7; --muted:#71717a; --green:#10b981; --gold:#fbbf24; --red:#f43f5e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif; padding:24px; }
  .wrap { max-width:1280px; margin:0 auto; }
  .pagetitle { font-size:13px; color:var(--muted); margin-bottom:16px; letter-spacing:0.05em; }
  .pagetitle b { color:var(--text); font-size:15px; }
  .pagetitle a { color:#fbbf24; text-decoration:none; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  /* HERO */
  .hero { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; }
  .hero-price { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px; display:flex; flex-direction:column; justify-content:center; }
  .hero-price .label { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .hero-price .big { font-size:48px; font-weight:800; line-height:1; letter-spacing:-0.02em; }
  .hero-price .chg { font-size:20px; margin-top:6px; }
  .hero-price .meta { display:flex; gap:24px; margin-top:18px; font-size:13px; color:var(--muted); flex-wrap:wrap; }
  .hero-price .meta b { color:var(--text); }
  .hero-gauge { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge-zone { margin-top:8px; padding:6px 18px; border-radius:999px; font-size:15px; font-weight:600; }
  .gauge-dca { margin-top:10px; font-size:13px; color:var(--muted); }
  .gauge-dca b { font-size:18px; }
  /* CARDS */
  .section-title { font-size:14px; font-weight:600; color:var(--text); margin:8px 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .card-title { font-size:14px; color:var(--text); font-weight:600; }
  .card-status { font-size:12px; font-weight:600; }
  .card-sub { font-size:11px; color:var(--muted); margin-bottom:10px; }
  .card-now { font-size:13px; color:var(--muted); margin-bottom:4px; }
  .card-now b { font-size:21px; color:var(--text); font-weight:800; }
  .card-score { font-size:34px; font-weight:700; line-height:1; }
  .card-score-max { font-size:15px; color:var(--muted); font-weight:400; }
  .card-bar { height:5px; background:var(--card2); border-radius:99px; margin:10px 0; overflow:hidden; }
  .card-bar-fill { height:100%; border-radius:99px; transition:width .3s; }
  .card-raw { font-size:13px; color:var(--muted); margin-top:2px; }
  .card-raw b { color:var(--text); }
  .card-dist { font-size:12px; color:var(--muted); margin-top:4px; font-style:italic; }
  .ma-rows { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .ma-row { display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  .ma-row span:first-child { color:var(--muted); }
  .ma-row b { color:var(--text); }
  .chart-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:24px; }
  .chart-box h3 { font-size:14px; margin-bottom:4px; }
  .chart-box .sub { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .sys-note { margin-top:18px; padding:16px 18px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:10px; font-size:13px; line-height:1.85; color:var(--muted); }
  .sys-note h4 { margin:0 0 8px; font-size:14px; color:var(--text); }
  .sys-note p { margin:6px 0; }
  .sys-note ul { margin:6px 0 0; padding-left:20px; }
  .sys-note li { margin:4px 0; }
  .sys-note b { color:var(--text); font-weight:600; }
  .disclaimer { margin-top:36px; padding-top:20px; border-top:1px solid var(--border); text-align:center; color:var(--muted); font-size:12px; line-height:1.9; }
  .disclaimer a { color:#fbbf24; text-decoration:none; }
  .updated { font-size:11px; color:var(--muted); margin-top:4px; }
  @media(max-width:900px){ .hero{grid-template-columns:1fr;} .grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:600px){ body{padding:14px;} .hero-price .big{font-size:36px;} .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="pagetitle"><b>🪙 BTC 底部信号看板</b> · 每15分钟自动更新 · 基于子琦原版架构</div>
  <div id="app"><div style="text-align:center;padding:80px;color:var(--muted);">加载中...</div></div>
  <div class="disclaimer">
    <p class="warn">⚠️ 个人研究，非投资建议。DYOR，盈亏自负。</p>
    <p class="src">数据：Gate.io · Alternative.me | 架构参考：<a href="https://btc.seanzhao.ai/">btc.seanzhao.ai</a></p>
  </div>
</div>

<script>
// === Embedded data (generated by GitHub Actions) ===
/* DATA_BLOCK_START */
window.__BTC__ = {};
/* DATA_BLOCK_END */
</script>

<script>
// === Render ===
const D = window.__BTC__;
if (!D || !D.price) {
  document.getElementById('app').innerHTML = '<div style="text-align:center;padding:80px;color:var(--muted);">⏳ 数据加载中...首次部署后1-2分钟自动生成</div>';
} else {
  render();
}

function fmtUSD(v) { return v == null ? '—' : '$' + Math.round(v).toLocaleString('en-US'); }
function fmtUSD2(v) { return v == null ? '—' : '$' + v.toLocaleString('en-US', {maximumFractionDigits:0}); }
function fmtPct(v) {
  if (v == null) return '—';
  return (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
}
function colorForScore(s) {
  if (s >= 80) return '#f43f5e';
  if (s >= 60) return '#fbbf24';
  if (s >= 40) return '#a1a1aa';
  return '#10b981';
}
function zoneForScore(s) {
  if (s >= 80) return {name:'极度低估', text:'#f43f5e', bg:'rgba(244,63,94,0.1)'};
  if (s >= 70) return {name:'低估区', text:'#fbbf24', bg:'rgba(251,191,36,0.1)'};
  if (s >= 55) return {name:'偏低估', text:'#10b981', bg:'rgba(16,185,129,0.1)'};
  if (s >= 40) return {name:'观望区', text:'#a1a1aa', bg:'rgba(161,161,170,0.06)'};
  return {name:'高估区', text:'#ef4444', bg:'rgba(239,68,68,0.1)'};
}
function statusForScore(s) {
  if (s >= 80) return {text:'● 极度低估', color:'#f43f5e'};
  if (s >= 70) return {text:'● 低估', color:'#fbbf24'};
  if (s >= 55) return {text:'● 偏低估', color:'#10b981'};
  if (s >= 40) return {text:'● 中性', color:'#a1a1aa'};
  return {text:'● 高估', color:'#ef4444'};
}

function drawGauge(score) {
  var cx=170, cy=165, r=118;
  var startAngle = Math.PI, endAngle = 0;
  var angle = startAngle + (score/100) * (endAngle-startAngle);
  var ac = colorForScore(score);

  var segs = [
    {s:startAngle, e:startAngle+0.4*(endAngle-startAngle), c:'#10b981'},
    {s:startAngle+0.4*(endAngle-startAngle), e:startAngle+0.65*(endAngle-startAngle), c:'#fbbf24'},
    {s:startAngle+0.65*(endAngle-startAngle), e:startAngle+0.85*(endAngle-startAngle), c:'#f97316'},
    {s:startAngle+0.85*(endAngle-startAngle), e:endAngle, c:'#ef4444'}
  ];

  var arcs = segs.map(function(s) {
    var sx=cx+r*Math.cos(s.s), sy=cy+r*Math.sin(s.s);
    var ex=cx+r*Math.cos(s.e), ey=cy+r*Math.sin(s.e);
    return '<path d="M '+sx.toFixed(2)+' '+sy.toFixed(2)+' A '+r+' '+r+' 0 '+(s.e-s.s>Math.PI?1:0)+' 1 '+ex.toFixed(2)+' '+ey.toFixed(2)+'" fill="none" stroke="'+s.c+'" stroke-width="28" opacity="0.35"/>';
  }).join('');

  var ax=cx+r*Math.cos(startAngle), ay=cy+r*Math.sin(startAngle);
  var ex=cx+r*Math.cos(angle), ey=cy+r*Math.sin(angle);
  var active = '<path d="M '+ax.toFixed(2)+' '+ay.toFixed(2)+' A '+r+' '+r+' 0 '+(angle-startAngle>Math.PI?1:0)+' 1 '+ex.toFixed(2)+' '+ey.toFixed(2)+'" fill="none" stroke="'+ac+'" stroke-width="28"/>';

  var px=cx+(r-15)*Math.cos(angle), py=cy+(r-15)*Math.sin(angle);
  var needle = '<line x1="'+cx+'" y1="'+cy+'" x2="'+px.toFixed(2)+'" y2="'+py.toFixed(2)+'" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="7" fill="#fff"/>';

  return '<svg viewBox="0 0 340 190" width="100%" style="max-width:380px;">'+
    arcs + active +
    '<text x="76.3" y="51.7" fill="#a1a1aa" font-size="11" font-weight="600" text-anchor="middle">观望</text>'+
    '<text x="236.7" y="34.0" fill="#10b981" font-size="11" font-weight="600" text-anchor="middle">偏低估</text>'+
    '<text x="273.9" y="61.1" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">低估</text>'+
    '<text x="309.8" y="113.6" fill="#ef4444" font-size="11" font-weight="600" text-anchor="middle"><tspan x="309.8">极度</tspan><tspan x="309.8" dy="1.15em">低估</tspan></text>'+
    '<text x="79.0" y="165.0" fill="#71717a" font-size="10" text-anchor="middle">0</text>'+
    '<text x="261.0" y="165.0" fill="#71717a" font-size="10" text-anchor="middle">100</text>'+
    needle +
    '<text x="'+cx+'" y="'+(cy-38)+'" fill="'+ac+'" font-size="46" font-weight="700" text-anchor="middle">'+Math.round(score)+'</text>'+
    '<text x="'+cx+'" y="'+(cy-14)+'" fill="#71717a" font-size="13" text-anchor="middle">/ 100</text>'+
    '</svg>';
}

function render() {
  var zone = zoneForScore(D.totalScore);
  var dcaMsg = D.totalScore>=80?'强烈买入信号！可分批建仓':
               D.totalScore>=70?'低估区域，适合定投加仓':
               D.totalScore>=55?'偏低估，可小额定投':
               D.totalScore>=40?'暂不便宜，继续观察':'价格偏高，注意风险';

  var cards = [
    {title:'S1 · 均线位置', score:D.maScore, max:20, sub:'价格相对中长期均线的位置',
     status:statusForScore(D.maScore*5),
     now:'BTC <b>'+fmtUSD2(D.price)+'</b> · MA50: '+fmtUSD2(D.ma50)+' · MA200: '+fmtUSD2(D.ma200),
     raw:'MA50: '+fmtUSD2(D.ma50)+' · MA120: '+fmtUSD2(D.ma120)+' · MA200: '+fmtUSD2(D.ma200),
     dist:D.price<D.ma200?'价格低于MA200（长期低估信号）':D.price<D.ma120?'低于MA120':'均线上方',
     color:colorForScore(D.maScore*5)},
    {title:'S2 · RSI 偏差', score:D.rsiScore, max:20, sub:'14日相对强弱指标',
     status:statusForScore(D.rsiScore*5),
     now:'RSI(14) <b>'+D.rsi.toFixed(1)+'</b> · '+(D.rsi<30?'超卖区':D.rsi<50?'偏弱':'中性'),
     raw:'RSI越低越接近底部 · 超卖(<30)为最强买入信号',
     dist:D.rsi<30?'已进入超卖区（强买入信号）':D.rsi<40?'接近超卖':'中性区间',
     color:colorForScore(D.rsiScore*5)},
    {title:'S3 · ATH回撤', score:D.ddScore, max:20, sub:'从历史最高点回撤的幅度',
     status:statusForScore(D.ddScore*5),
     now:'回撤 <b>'+D.drawdownPct.toFixed(1)+'%</b> · ATH: $124,715',
     raw:'回撤越大越接近底部 · 历史极端回撤70-85%',
     dist:D.drawdownPct>60?'深度回撤（历史大底特征）':D.drawdownPct>40?'显著回撤':'回撤不足',
     color:colorForScore(D.ddScore*5)},
    {title:'S4 · 恐慌贪婪', score:D.fngScore, max:20, sub:'市场情绪指标',
     status:statusForScore(D.fngScore*5),
     now:'恐慌指数 <b>'+D.fngVal+'</b> · 「'+D.fngClass+'」',
     raw:'0=极度恐慌(底部) / 100=极度贪婪(顶部)',
     dist:D.fngVal<=15?'已进入恐慌抄底区':D.fngVal<=30?'偏恐慌':'情绪中性',
     color:'#fbbf24'},
    {title:'S5 · 区间位置', score:D.posScore, max:20, sub:'价格在近90天高低点间的位置',
     status:statusForScore(D.posScore*5),
     now:'当前 <b>'+D.posInRange.toFixed(1)+'%</b> · 90日: '+fmtUSD2(D.lo90)+' - '+fmtUSD2(D.hi90),
     raw:'越接近90日低点越有支撑 · 越低越好',
     dist:D.posInRange<20?'接近90日低点（强支撑）':D.posInRange<40?'偏低位置':'中高位',
     color:colorForScore(D.posScore*5)},
  ];

  var html = '';
  // Hero
  html += '<div class="hero">';
  html += '<div class="hero-price">';
  html += '<div class="label">BTC 价格 (USD)</div>';
  html += '<div class="big">'+fmtUSD(D.price)+'</div>';
  html += '<div class="chg"><span class="'+(D.chgPct>=0?'pos':'neg')+'">'+fmtPct(D.chgPct)+'</span> <span style="color:var(--muted);font-size:13px;">24h</span></div>';
  html += '<div class="meta"><span>24h高: <b>'+fmtUSD(D.high24)+'</b></span><span>24h低: <b>'+fmtUSD(D.low24)+'</b></span><span>量: <b>$'+(D.vol24/1e9).toFixed(1)+'B</b></span></div>';
  html += '<div class="updated">更新: '+D.updated+'</div>';
  html += '</div>';
  html += '<div class="hero-gauge" style="background:'+zone.bg+'">';
  html += '<div style="font-size:13px;color:var(--muted);align-self:flex-start;">综合评分</div>';
  html += drawGauge(D.totalScore);
  html += '<div class="gauge-zone" style="background:'+zone.bg+';color:'+zone.text+';">'+zone.name+'</div>';
  html += '<div class="gauge-dca"><b style="color:'+zone.text+';">'+dcaMsg+'</b></div>';
  html += '</div></div>';

  // Cards
  html += '<div class="section-title">5 个信号 + 均线参考</div><div class="grid">';
  cards.forEach(function(c) {
    var barW = c.score/c.max*100;
    html += '<div class="card" style="border-color:'+c.color+'33;">';
    html += '<div class="card-head"><span class="card-title">'+c.title+'</span><span class="card-status" style="color:'+c.status.color+'">'+c.status.text+'</span></div>';
    html += '<div class="card-sub">'+c.sub+'</div>';
    html += '<div class="card-score" style="color:'+c.color+';">'+c.score+'<span class="card-score-max">/'+c.max+'</span></div>';
    html += '<div class="card-bar"><div class="card-bar-fill" style="width:'+barW+'%;background:'+c.color+';"></div></div>';
    html += '<div class="card-now">'+c.now+'</div>';
    html += '<div class="card-raw">'+c.raw+'</div>';
    html += '<div class="card-dist">'+c.dist+'</div>';
    html += '</div>';
  });
  // MA card
  html += '<div class="card" style="border-color:#3f3f4633;">';
  html += '<div class="card-head"><span class="card-title">MA · 均线参考</span><span class="card-status" style="color:#71717a;">纯参考</span></div>';
  html += '<div class="card-sub">中长期均线</div>';
  html += '<div class="ma-rows">';
  [['MA50',D.ma50],['MA120',D.ma120],['MA200',D.ma200]].forEach(function(r) {
    var pct = (D.price/r[1]-1)*100;
    html += '<div class="ma-row"><span>'+r[0]+'</span><b>'+fmtUSD2(r[1])+'</b><span class="'+(pct>=0?'pos':'neg')+'">'+fmtPct(pct)+'</span></div>';
  });
  html += '<div class="card-raw" style="margin-top:8px;">'+(D.price<D.ma200?'价格跌破均线(偏弱·底部特征)':'价格在均线上方')+'</div>';
  html += '</div></div>';

  document.getElementById('app').innerHTML = html;

  // Chart
  Plotly.newPlot(document.getElementById('app').appendChild(
    Object.assign(document.createElement('div'),{className:'chart-box',innerHTML:'<h3>📈 BTC价格 + 综合评分</h3><div class="sub">绿线=综合评分(右轴) · 数据每15分钟更新</div><div id="mainChart" style="height:420px;"></div>'})
  ).querySelector('#mainChart'), [
    {x:D.chartDates, y:D.chartPrices, type:'scatter', mode:'lines', name:'BTC价格', yaxis:'y',
     line:{color:'#fbbf24',width:1.5}, hovertemplate:'%{x}<br>$%{y:,.0f}<extra></extra>'},
    {x:D.chartDates, y:D.chartScores, type:'scatter', mode:'lines', name:'综合评分', yaxis:'y2',
     line:{color:'#10b981',width:1}, hovertemplate:'%{x}<br>%{y:.0f}/100<extra></extra>'}
  ], {
    paper_bgcolor:'#161618', plot_bgcolor:'#0a0a0b',
    font:{color:'#e4e4e7'}, hovermode:'x unified',
    xaxis:{gridcolor:'#27272a', tickfont:{size:10}},
    yaxis:{type:'log', gridcolor:'#27272a', tickfont:{size:10}, title:{text:'价格(log)',font:{size:11}}},
    yaxis2:{overlaying:'y', side:'right', range:[0,100], tickfont:{size:10}, title:{text:'综合评分',font:{size:11}}, showgrid:false},
    margin:{l:60,r:55,t:10,b:40},
    legend:{x:0.01,y:0.99,bgcolor:'rgba(0,0,0,0)'}
  }, {responsive:true});
}
</script>
</body>
</html>
